{% extends "base.html" %}
{% block title %}Новый пароль{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:0 auto;">
  <h1>Задайте новый пароль</h1>
  <p><small>Эта ссылка одноразовая — после сохранения пароля она перестанет работать.</small></p>
  <form method="post" action="/auth/reset/{{ token }}">
    <div class="field">
      <label>Новый пароль</label>
      <input type="password" name="new_password" required minlength="8">
    </div>
    <div class="field">
      <label>Повторите новый пароль</label>
      <input type="password" name="new_password2" required minlength="8">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Сохранить</button>
  </form>
</div>
{% endblock %}
